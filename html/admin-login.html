<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 로그인 — 여행의 결</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/pages.css"><script type="module" src="../js/admin-login.js"></script></head>
<body class="form-page"><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="site-header"><div class="header-inner"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">ㄱ</span><span>여행의 결</span></a></div></header>
<main id="main" class="form-main"><section class="form-card" aria-labelledby="admin-login-title"><p class="eyebrow">ADMIN ACCESS</p><h1 id="admin-login-title">관리자 로그인</h1><p class="form-intro">Firebase Authentication에 등록된 관리자 계정으로 로그인하세요.</p>
<form id="admin-login-form" novalidate><label for="admin-id">아이디</label><input id="admin-id" name="username" autocomplete="username" value="admin" required><label for="admin-password">비밀번호</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required><button class="button button-dark form-submit" type="submit">관리자 로그인</button><p class="form-error" id="form-error" role="alert" hidden></p></form>
<p class="admin-setup-note">아이디 <code>admin</code>은 <code>js/firebase-config.js</code>의 <code>adminAuthEmail</code>에 설정한 Firebase Authentication 이메일로 로그인합니다. 로그인한 계정 UID가 Realtime Database의 <code>/admins/{UID}</code>에 boolean <code>true</code>로 등록되어 있어야 관리자 권한이 확인됩니다.</p></section></main></body></html>
