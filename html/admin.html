<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 대시보드 — 여행의 결</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/admin.css"><script type="module" src="../js/admin.js"></script></head>
<body class="admin-page"><a class="skip-link" href="#admin-main">본문으로 건너뛰기</a><header class="admin-header"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">ㄱ</span><span>여행의 결</span><span class="admin-badge">관리자</span></a><div class="admin-header-actions"><span id="admin-email"></span><button class="button button-small button-dark" id="admin-logout" type="button">관리자로그아웃</button></div></header>
<main id="admin-main" class="admin-shell"><div class="admin-title"><div><p class="eyebrow">TRAVEL ADMIN</p><h1>관리자 대시보드</h1><p>여행지, 숙소, 예약과 회원 정보를 관리합니다.</p></div></div><section class="admin-metrics" aria-label="운영 현황"><article><span>여행지</span><strong id="count-destinations">—</strong></article><article><span>숙소</span><strong id="count-stays">—</strong></article><article><span>회원</span><strong id="count-members">—</strong></article><article><span>확인 대기 예약</span><strong id="count-pending">—</strong></article></section><p class="admin-message" id="admin-message" role="status" hidden></p>
<nav class="admin-tabs" aria-label="관리 메뉴"><button class="admin-tab is-active" data-tab="destinations" type="button">여행지 관리</button><button class="admin-tab" data-tab="stays" type="button">숙소 관리</button><button class="admin-tab" data-tab="reservations" type="button">예약 확인</button><button class="admin-tab" data-tab="members" type="button">회원정보</button></nav>
<section class="admin-panel is-active" data-panel="destinations"><div class="panel-heading"><div><h2>여행지 등록·수정</h2><p>공개 여부를 설정해 홈 화면 노출을 관리합니다.</p></div></div><form class="admin-form" id="destination-form"><input name="id" type="hidden"><label>여행지명<input name="name" required maxlength="100"></label><label>지역<input name="region" required maxlength="100"></label><label>대표 주소<input name="address" maxlength="200"></label><label>대표 이미지 URL<input name="imageUrl" type="url"></label><label class="wide">짧은 소개<input name="summary" required maxlength="180"></label><label class="wide">상세 소개<textarea name="description" rows="3"></textarea></label><label class="check-label"><input name="isPublished" type="checkbox"> 공개</label><div class="form-actions"><button class="button button-dark" type="submit">저장</button><button class="button button-outline" type="reset">초기화</button></div></form><div class="admin-list" id="destinations-list" aria-live="polite"></div></section>
<section class="admin-panel" data-panel="stays" hidden><div class="panel-heading"><div><h2>숙소 등록·수정</h2><p>여행지 연결과 숙박 정보를 입력합니다.</p></div></div><form class="admin-form" id="stay-form"><input name="id" type="hidden"><label>숙소명<input name="name" required maxlength="100"></label><label>연결 여행지<select name="destinationId" required><option value="">여행지 선택</option></select></label><label>주소<input name="address" maxlength="200"></label><label>대표 이미지 URL<input name="imageUrl" type="url"></label><label>1박 가격(원)<input name="pricePerNight" type="number" min="0" required></label><label>최대 인원<input name="maxGuests" type="number" min="1" required></label><label class="wide">짧은 소개<input name="summary" required maxlength="180"></label><label class="wide">상세 소개<textarea name="description" rows="3"></textarea></label><label>문의 연락처<input name="contact" type="tel"></label><label class="check-label"><input name="isActive" type="checkbox" checked> 활성</label><div class="form-actions"><button class="button button-dark" type="submit">저장</button><button class="button button-outline" type="reset">초기화</button></div></form><div class="admin-list" id="stays-list" aria-live="polite"></div></section>
<section class="admin-panel" data-panel="reservations" hidden><div class="panel-heading"><div><h2>예약 확인</h2><p>신청된 예약의 날짜·인원·연락처와 상태를 확인하고 변경합니다.</p></div></div><div class="admin-list" id="reservations-list" aria-live="polite"></div></section>
<section class="admin-panel" data-panel="members" hidden><div class="panel-heading"><div><h2>회원정보</h2><p>회원 프로필과 가입 상태를 조회합니다. 비밀번호는 표시되지 않습니다.</p></div></div><div class="admin-list" id="members-list" aria-live="polite"></div></section>
</main></body></html>
