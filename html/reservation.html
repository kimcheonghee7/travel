<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>예약 신청 — 여행의 결</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/pages.css"><script type="module" src="../js/reservation.js"></script></head>
<body class="form-page"><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="site-header"><div class="header-inner"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">ㄱ</span><span>여행의 결</span></a></div></header>
<main id="main" class="form-main"><section class="form-card" aria-labelledby="reservation-title"><p class="eyebrow">YOUR NEXT STAY</p><h1 id="reservation-title">예약 신청</h1><p class="form-intro">예약 신청 후 관리자가 확인해 확정합니다. 결제는 진행되지 않습니다.</p>
<form id="reservation-form" novalidate><label for="stay">숙소</label><select id="stay" name="stayId" required><option value="">숙소를 불러오는 중…</option></select><p class="stay-selection-note" id="stay-note"></p><label for="check-in">체크인</label><input id="check-in" name="checkIn" type="date" required><label for="check-out">체크아웃</label><input id="check-out" name="checkOut" type="date" required><label for="guest-count">인원</label><input id="guest-count" name="guestCount" type="number" min="1" value="1" required><label for="guest-name">예약자 이름</label><input id="guest-name" name="guestName" autocomplete="name" required maxlength="60"><label for="guest-phone">연락처</label><input id="guest-phone" name="guestPhone" type="tel" autocomplete="tel" required><label for="request-note">요청사항 <span class="optional">선택</span></label><textarea id="request-note" name="requestNote" rows="3" maxlength="500"></textarea><button class="button button-dark form-submit" type="submit">예약 신청</button><p class="form-error" id="form-error" role="alert" hidden></p></form></section></main></body></html>
